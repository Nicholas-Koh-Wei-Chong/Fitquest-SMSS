<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitQuest | School Physical Fitness Assessment</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header>

    <div class="container">

        <h1>🌿 FitQuest</h1>

        <p>School Physical Fitness Assessment System</p>

    </div>

</header>

<section class="hero">

    <div class="container">

        <h2>Train. Track. Thrive.</h2>

        <p>

            Helping every student achieve their personal best through accurate NAPFA assessment, progress tracking and personalised fitness recommendations.

        </p>

    </div>

</section>

<section class="container">

    <div class="card">

        <h2>Student Information</h2>

        <form id="assessmentForm">

            <label>Student Name</label>

            <input type="text" id="name">

            <label>Class</label>

            <input type="text" id="studentClass">

            <label>Age</label>

            <select id="age">

                <option>12</option>
                <option>13</option>
                <option>14</option>
                <option>15</option>
                <option>16</option>
                <option>17</option>
                <option>18</option>
                <option>19</option>

            </select>

            <label>Gender</label>

            <input type="text" value="Female" disabled>

            <button type="button" id="startBtn">

                Start Assessment

            </button>

        </form>

    </div>

</section>

<script src="js/app.js"></script>

</body>
</html>
